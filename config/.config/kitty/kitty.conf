# Remove the include below to disconnect Kitty from Omarchy's theming system.
include ~/.local/state/omarchy/current/theme/kitty.conf

# ==============================================================================
# FONT SETTINGS
# ==============================================================================

font_size 11.0

modify_font baseline 0
modify_font underline_position 2

# BEGIN_KITTY_FONTS
font_family      family='JetBrainsMono Nerd Font' postscript_name=JetBrainsMonoNF-Regular
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS

# ==============================================================================
# CURSOR SETTINGS
# ==============================================================================
cursor_trail 3
cursor_trail_decay_delta 0.05
# Cursor shape
cursor_shape beam

cursor_blink_interval 0.4 ease-in-out

# ===============================================================================
# CTRL BACKSPACE TO DELETE THE WHOLE WORD
# ===============================================================================
map ctrl+backspace send_text all \x1b\x7f
